<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Calendar Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="sidebar">
    <h1>Calendar Map</h1>
    <p class="subtitle">Upload an Apple Calendar export (.ics) to plot event locations on the map.</p>

    <div id="upload-area">
      <label for="file-input" id="drop-label">
        <span id="drop-text">Drop .ics file here or click to browse</span>
        <input type="file" id="file-input" accept=".ics" />
      </label>
    </div>

    <button id="process-btn" disabled>Process Calendar</button>

    <div id="status" class="hidden"></div>

    <div id="legend" class="hidden">
      <div class="legend-item"><span class="dot green"></span> Geocoded</div>
      <div class="legend-item"><span class="dot red"></span> Location not found</div>
    </div>

    <div id="event-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
